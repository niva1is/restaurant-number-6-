# Инфраструктура QR Restaurant.
#
#   docker compose up -d                       — только PostgreSQL + RabbitMQ (бэкенд запускается через npm run dev)
#   docker compose --profile full up -d --build — плюс контейнер бэкенда (миграции и сид применяются автоматически)
#
# Значения берутся из .env (см. .env.example); значения по умолчанию подходят для локальной разработки.

services:
  postgres:
    image: postgres:16-alpine
    container_name: qr-restaurant-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-qr_restaurant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Создаёт отдельную БД для интеграционных тестов
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qr_restaurant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: qr-restaurant-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-qr-restaurant.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  backend:
    profiles: ["full"]
    build: .
    container_name: qr-restaurant-backend
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-qr_restaurant}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      WAITER_CALL_COOLDOWN_SECONDS: ${WAITER_CALL_COOLDOWN_SECONDS:-30}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_COOK_PASSWORD: ${SEED_COOK_PASSWORD:-cook123}
      SEED_WAITER_PASSWORD: ${SEED_WAITER_PASSWORD:-waiter123}
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
