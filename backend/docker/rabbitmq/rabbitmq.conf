# Сообщение о вызове официанта остаётся неподтверждённым (unacked), пока официант
# не примет вызов. По умолчанию RabbitMQ закрывает канал через 30 минут ожидания ack;
# увеличиваем до 24 часов. Если таймаут всё же сработает, бэкенд переподключится,
# а брокер повторно доставит сообщение (дубль не создаётся — проверка по event_id).
consumer_timeout = 86400000
